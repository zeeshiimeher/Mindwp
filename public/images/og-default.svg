<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.72" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif; font-weight: 800; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif; font-weight: 600; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif; font-weight: 500; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.10" stroke="#ffffff">
    <path d="M0 105H1200 M0 210H1200 M0 315H1200 M0 420H1200 M0 525H1200" />
    <path d="M150 0V630 M300 0V630 M450 0V630 M600 0V630 M750 0V630 M900 0V630 M1050 0V630" />
  </g>

  <!-- Premium card mock UI -->
  <g filter="url(#shadow)">
    <rect x="620" y="120" rx="22" ry="22" width="480" height="390" fill="#0b1220" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.16"/>

    <!-- Top bar -->
    <rect x="648" y="148" rx="12" ry="12" width="424" height="48" fill="#ffffff" fill-opacity="0.08"/>
    <circle cx="676" cy="172" r="6" fill="#ff5f57" fill-opacity="0.95"/>
    <circle cx="696" cy="172" r="6" fill="#febc2e" fill-opacity="0.95"/>
    <circle cx="716" cy="172" r="6" fill="#28c840" fill-opacity="0.95"/>
    <rect x="748" y="164" rx="8" ry="8" width="180" height="16" fill="#ffffff" fill-opacity="0.10"/>

    <!-- Content blocks -->
    <rect x="648" y="214" rx="14" ry="14" width="424" height="120" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="674" y="242" rx="8" ry="8" width="250" height="14" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="674" y="268" rx="7" ry="7" width="330" height="12" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="674" y="292" rx="7" ry="7" width="300" height="12" fill="#ffffff" fill-opacity="0.10"/>

    <rect x="648" y="354" rx="14" ry="14" width="208" height="156" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="864" y="354" rx="14" ry="14" width="208" height="156" fill="#ffffff" fill-opacity="0.06"/>

    <!-- Accent pills -->
    <rect x="674" y="384" rx="12" ry="12" width="122" height="26" fill="url(#accent)" fill-opacity="0.95"/>
    <text x="735" y="402" text-anchor="middle" font-size="13" class="mono" fill="#ffffff" opacity="0.95">WordPress</text>

    <rect x="674" y="420" rx="12" ry="12" width="140" height="26" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="744" y="438" text-anchor="middle" font-size="13" class="mono" fill="#ffffff" opacity="0.92">Automation</text>

    <rect x="674" y="456" rx="12" ry="12" width="72" height="26" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="710" y="474" text-anchor="middle" font-size="13" class="mono" fill="#ffffff" opacity="0.92">AI</text>

    <!-- Simple circuit nodes -->
    <g opacity="0.9">
      <circle cx="980" cy="248" r="6" fill="#60a5fa"/>
      <circle cx="1036" cy="306" r="6" fill="#7c3aed"/>
      <circle cx="940" cy="330" r="6" fill="#ffffff" fill-opacity="0.85"/>
      <path d="M980 248 L1036 306 L940 330" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Brand mark (simple high-contrast) -->
  <g transform="translate(96 92)">
    <circle cx="64" cy="64" r="64" fill="#1e3a8a"/>
    <path d="M 28 100 L 28 28 L 52 28 L 64 62 L 76 28 L 100 28 L 100 100 L 80 100 L 80 56 L 64 88 L 48 56 L 48 100 Z" fill="#ffffff"/>
  </g>

  <!-- Headline + positioning -->
  <text x="200" y="152" font-size="26" class="subtitle" fill="#ffffff" opacity="0.92">MindWP</text>
  <text x="200" y="220" font-size="64" class="title" fill="#ffffff">Smart Websites</text>
  <text x="200" y="264" font-size="22" class="body" fill="#ffffff" opacity="0.86">Built on WordPress. Automated with workflows. Enhanced with AI.</text>

  <!-- Value line (premium agency) -->
  <g transform="translate(200 312)" opacity="0.92">
    <rect x="0" y="0" rx="14" ry="14" width="420" height="44" fill="#0b1220" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="18" y="29" font-size="16" class="subtitle" fill="#ffffff" opacity="0.95">Premium digital agency platform</text>
    <circle cx="350" cy="22" r="4" fill="#60a5fa"/>
    <circle cx="368" cy="22" r="4" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="386" cy="22" r="4" fill="#7c3aed"/>
  </g>

  <!-- Footer hint -->
  <text x="200" y="420" font-size="16" class="body" fill="#ffffff" opacity="0.78">Websites that work while you sleep</text>
</svg>
